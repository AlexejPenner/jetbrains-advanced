# ZenML PipelineRunConfiguration for the advanced static-pipeline demo.
run_name: 01-static-churn-threshold-040_{date}_{time}
enable_cache: true
enable_artifact_visualization: true
tags:
  - workshop
  - chapter-01
  - threshold-040
docker:
  requirements:
    - pandas>=2.2,<4
    - numpy>=1.26,<3
    - scikit-learn>=1.4.1,<2
    - opentelemetry-api==1.43.0
    - opentelemetry-sdk==1.43.0

parameters:
  n_customers: 1200
  seed: 17
  test_size: 0.25
  regularization: 1.0
  threshold: 0.4

steps:
  train_churn_model:
    enable_step_logs: true
    enable_cache: false
  create_evaluation_report:
    docker:
      requirements:
        - pandas>=2.2,<4
        - numpy>=1.26,<3
        - opentelemetry-api==1.43.0
        - opentelemetry-sdk==1.43.0
    enable_cache: false
    enable_artifact_visualization: true
