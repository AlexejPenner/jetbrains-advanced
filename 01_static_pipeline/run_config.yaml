# ZenML PipelineRunConfiguration for the advanced static-pipeline demo.
run_name: 01-static-churn-threshold-040_{date}_{time}
enable_cache: true
enable_artifact_visualization: true
tags:
  - workshop
  - chapter-01
  - threshold-040

parameters:
  n_customers: 1200
  seed: 17
  test_size: 0.25
  regularization: 1.0
  threshold: 0.4

steps:
  train_churn_model:
    enable_step_logs: true
    enable_cache: false
  create_evaluation_report:
    enable_cache: false
    enable_artifact_visualization: true
